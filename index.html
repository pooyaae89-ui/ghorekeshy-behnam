<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قرعه کشی بهنام | پارس مشکی</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#050505;
    color:#fff;
    line-height:1.8;
}

header{
    position:sticky;
    top:0;
    z-index:10;
    background:#080808;
    border-bottom:1px solid #3c2b0d;
    padding:18px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.gold{
    color:#e5b94f;
}

.btn{
    border:none;
    border-radius:9px;
    padding:13px 25px;
    cursor:pointer;
    font-weight:bold;
    color:#111;
    background:linear-gradient(135deg,#f7dc83,#b9821e);
}

.outline{
    border:1px solid #92701f;
    background:transparent;
    color:#e5b94f;
    border-radius:9px;
    padding:11px 20px;
    cursor:pointer;
}

.hero{
    max-width:1200px;
    margin:auto;
    padding:70px 6%;
    display:flex;
    align-items:center;
    gap:50px;
}

.hero-text{
    flex:1;
}

.hero-car{
    flex:1;
    text-align:center;
}

.hero-car img{
    width:100%;
    max-width:560px;
    border-radius:20px;
    box-shadow:0 0 80px rgba(210,160,40,.18);
}

.small-title{
    color:#d7aa3b;
    font-size:18px;
}

h1{
    font-size:68px;
    line-height:1.2;
    margin:15px 0;
}

.badge{
    display:inline-block;
    padding:9px 17px;
    border:1px solid #80611d;
    border-radius:8px;
    color:#e8c762;
}

.hero p{
    color:#aaa;
    margin-top:20px;
    max-width:600px;
}

.actions{
    display:flex;
    gap:12px;
    margin-top:25px;
    flex-wrap:wrap;
}

.section{
    max-width:1150px;
    margin:25px auto;
    padding:35px;
    background:#0d0d0d;
    border:1px solid #30240f;
    border-radius:18px;
}

.section-title{
    text-align:center;
    color:#efd47c;
    margin-bottom:25px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    text-align:center;
}

.stat{
    padding:20px;
    border:1px solid #2e2516;
    border-radius:12px;
}

.stat strong
